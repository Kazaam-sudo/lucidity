<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Lucidity</title>

  <!-- ===== PWA / META ===== -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===== STYLES ===== -->
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0b0b;
      color: #eaeaea;
    }
    header {
      padding: 16px;
      border-bottom: 1px solid #222;
    }
    h1 {
      margin: 0 0 12px 0;
      font-weight: 600;
      opacity: 0.85;
    }
    nav button {
      margin-right: 8px;
      padding: 6px 10px;
      background: #111;
      color: #ccc;
      border: 1px solid #333;
      cursor: pointer;
    }
    nav button.active {
      background: #222;
      color: #fff;
    }
    nav button.sync {
      background: #5a2e7a;
      border-color: #5a2e7a;
      color: #fff;
    }
    main {
      padding: 16px;
    }
    input, textarea, select {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      background: #111;
      color: #eee;
      border: 1px solid #333;
    }
    textarea {
      min-height: 80px;
    }
    .entry {
      margin-top: 8px;
      opacity: 0.85;
      font-size: 14px;
    }
    .muted {
      opacity: 0.6;
    }
  </style>
</head>

<body>
<div id="root"></div>

<!-- ===== REACT / BABEL ===== -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">

/* ============================================================
   🔧 CONFIG
   ============================================================ */

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRWUhPm5Clc6iIR8tIwoE6L1J57Y6nlBdhIMUxqlKCk13jRlspF_MFCxoSZB3x0J5Edg/exec";

/* ============================================================
   💾 STORAGE HELPERS
   ============================================================ */

const STORAGE_KEY = "lucidity_journal";

function loadJournal() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function saveJournal(entries) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

/* ============================================================
   🔁 SYNC TO GOOGLE SHEETS
   ============================================================ */

async function syncToGoogle(entries) {
  const unsynced = entries.filter(e => !e.synced);
  if (!unsynced.length) return;

  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ entries: unsynced })
  });

  const text = await res.text();

  if (text.startsWith("<")) {
    throw new Error("Apps Script вернул HTML (проверь /exec)");
  }

  const data = JSON.parse(text);
  if (!data.ok) throw new Error(data.error || "Sync error");

  // помечаем как синхронизированные
  const updated = entries.map(e => ({ ...e, synced: true }));
  saveJournal(updated);
  return updated;
}

/* ============================================================
   🧠 JOURNAL COMPONENT
   ============================================================ */

function Journal({ entries, setEntries }) {
  const [sleepTime, setSleepTime] = React.useState("");
  const [wakeTime, setWakeTime] = React.useState("");
  const [technique, setTechnique] = React.useState("");
  const [note, setNote] = React.useState("");

  function saveEntry() {
    const entry = {
      date: new Date().toISOString().slice(0,10),
      sleepTime,
      wakeTime,
      technique,
      note,
      synced: false
    };

    const updated = [entry, ...entries].slice(0, 5);
    setEntries(updated);
    saveJournal(updated);

    setSleepTime("");
    setWakeTime("");
    setTechnique("");
    setNote("");
  }

  return (
    <>
      <input type="time" value={sleepTime} onChange={e => setSleepTime(e.target.value)} />
      <input type="time" value={wakeTime} onChange={e => setWakeTime(e.target.value)} />

      <select value={technique} onChange={e => setTechnique(e.target.value)}>
        <option value="">Техника</option>
        <option value="MILD">MILD</option>
        <option value="WBTB">WBTB</option>
        <option value="RC">RC</option>
        <option value="WILD">WILD</option>
      </select>

      <textarea
        placeholder="Сон / ощущения / выводы"
        value={note}
        onChange={e => setNote(e.target.value)}
      />

      <button onClick={saveEntry}>Save</button>

      {entries.map((e, i) => (
        <div key={i} className="entry">
          {e.date} · {e.technique || "—"} {e.synced ? "✓" : "•"}
        </div>
      ))}
    </>
  );
}

/* ============================================================
   📊 TRACKER (ПУСТО — ПОКА)
   ============================================================ */

function Tracker() {
  return <p className="muted">Tracker будет добавлен позже (календарь).</p>;
}

/* ============================================================
   🧭 HELP (ПОКА БАЗА)
   ============================================================ */

function Help() {
  return (
    <pre className="muted">
ТВОЙ WILD ПРИ ЗАСЫПАНИИ (ГЛУБОКИЙ)

Метод «Тонкий якорь»

— выбери один якорь
— касайся и отпускай
— смотри ИЗ образов
— стабилизация: трение ладоней
    </pre>
  );
}

/* ============================================================
   ⚙️ SETTINGS
   ============================================================ */

function Settings() {
  return <p className="muted">Настройки (позже).</p>;
}

/* ============================================================
   🚀 APP ROOT
   ============================================================ */

function App() {
  const [page, setPage] = React.useState("journal");
  const [entries, setEntries] = React.useState(loadJournal());

  async function handleSync() {
    try {
      const updated = await syncToGoogle(entries);
      if (updated) setEntries(updated);
      alert("Синхронизация успешна");
    } catch (e) {
      alert("Ошибка синка: " + e.message);
    }
  }

  return (
    <>
      <header>
        <h1>Lucidity</h1>
        <nav>
          <button className={page==="journal"?"active":""} onClick={()=>setPage("journal")}>Journal</button>
          <button className={page==="tracker"?"active":""} onClick={()=>setPage("tracker")}>Tracker</button>
          <button className={page==="help"?"active":""} onClick={()=>setPage("help")}>Help</button>
          <button className={page==="settings"?"active":""} onClick={()=>setPage("settings")}>Settings</button>
          <button className="sync" onClick={handleSync}>Sync</button>
          <span className="muted"> v0.4.0</span>
        </nav>
      </header>

      <main>
        {page==="journal" && <Journal entries={entries} setEntries={setEntries} />}
        {page==="tracker" && <Tracker />}
        {page==="help" && <Help />}
        {page==="settings" && <Settings />}
      </main>
    </>
  );
}

/* ============================================================
   🔌 MOUNT
   ============================================================ */

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
