function read(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch { return fallback; }
}
function write(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

/* ===== GOOGLE SHEETS SYNC (без дублей) ===== */
async function syncToSheets(entries) {
  const unsynced = entries.filter(e => !e.synced);
  if (!unsynced.length) {
    alert("Нет новых записей");
    return entries;
  }
  const res = await fetch(SHEETS_WEBHOOK_URL, {
    method: "POST",
    body: JSON.stringify({ entries: unsynced })
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "sync error");

  return entries.map(e => ({ ...e, synced: true }));
}
