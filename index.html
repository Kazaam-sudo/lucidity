<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Lucidity</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===== BLOCK: CACHE CONTROL ===== -->
  <!-- Отключаем кэш HTML, чтобы всегда видеть новую версию -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- ===== BLOCK: REACT CDN ===== -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- ===== BLOCK: STYLES ===== -->
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
    }
    button {
      margin: 4px;
      padding: 8px 12px;
      background: #1f1f1f;
      color: #fff;
      border: 1px solid #333;
      cursor: pointer;
    }
    input, textarea {
      width: 100%;
      margin: 6px 0;
      padding: 8px;
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
    }
    ul { padding-left: 18px; }
    li { margin: 4px 0; }
  </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

// ===================================================
// =============== BLOCK: APP CONFIG =================
// ===================================================
const APP_VERSION = "0.3.0";
const SHEETS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxRWUhPm5Clc6iIR8tIwoE6L1J57Y6nlBdhIMUxqlKCk13jRlspF_MFCxoSZB3x0J5Edg/exec";


// ===================================================
// =============== BLOCK: STORAGE KEYS ===============
// ===================================================
const JOURNAL_KEY = "lucidity_journal";
const RC_KEY = "lucidity_rc";

// ===================================================
// =============== BLOCK: RC DATA ====================
// ===================================================
const RC_TASKS = [
  "Посмотри на руки — меняются ли?",
  "Прочитай любой текст дважды.",
  "Зажми нос и попробуй дышать.",
  "Спроси себя: я сейчас сплю?"
];

// ===================================================
// =============== BLOCK: MAIN APP ===================
// ===================================================
function App() {
  const [page, setPage] = React.useState("journal");

  // ---------- BLOCK: JOURNAL STATE ----------
  const [entries, setEntries] = React.useState(
    JSON.parse(localStorage.getItem(JOURNAL_KEY) || "[]")
  );

  // =================================================
  // =============== BLOCK: JOURNAL LOGIC ============
  // =================================================
  function saveJournalEntry() {
    const entry = {
      date: new Date().toLocaleDateString(),
      sleepTime: document.getElementById("sleepTime").value,
      wakeTime: document.getElementById("wakeTime").value,
      technique: document.getElementById("technique").value,
      level: document.getElementById("level").value,
      note: document.getElementById("note").value.trim()
    };

    if (!entry.note) return;

    const updated = [...entries, entry];
    setEntries(updated);
    localStorage.setItem(JOURNAL_KEY, JSON.stringify(updated));

    ["sleepTime","wakeTime","technique","level","note"]
      .forEach(id => document.getElementById(id).value = "");
  }

  // =======================================
  // BLOCK: GOOGLE SHEETS SYNC
  // =======================================
async function syncToSheets() {
  if (!SHEETS_WEBHOOK_URL) {
    alert("Sheets webhook not configured");
    return;
  }

  if (entries.length === 0) {
    alert("Нет записей для синка");
    return;
  }

  try {
    const res = await fetch(SHEETS_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ entries })
    });

    const result = await res.json();

    if (result.ok) {
      alert("Синхронизировано с Google Sheets ✅");
    } else {
      alert("Ошибка синка: " + result.error);
    }
  } catch (err) {
    alert("Ошибка сети: " + err.message);
  }
}


  // =================================================
  // =============== BLOCK: RC LOGIC =================
  // =================================================
  function logRC() {
    const task = RC_TASKS[Math.floor(Math.random() * RC_TASKS.length)];
    const rc = JSON.parse(localStorage.getItem(RC_KEY) || "[]");

    rc.push({
      time: new Date().toLocaleString(),
      task
    });

    localStorage.setItem(RC_KEY, JSON.stringify(rc));
    alert("Reality Check:\n" + task);
  }

  // =================================================
  // =============== BLOCK: UI =======================
  // =================================================
  return (
    <div>
      <h1>Lucidity</h1>

      {/* ===== BLOCK: NAVIGATION ===== */}
      <nav>
        <button onClick={() => setPage("journal")}>Journal</button>
        <button onClick={() => setPage("tracker")}>Tracker</button>
        <button onClick={logRC}>Quick RC</button>
        <button onClick={syncToSheets}>Sync</button>
      </nav>

      {/* ===== BLOCK: JOURNAL UI ===== */}
      {page === "journal" && (
        <div>
          <h2>Journal</h2>

          <input id="sleepTime" placeholder="Лёг спать (23:30)" />
          <input id="wakeTime" placeholder="Проснулся (06:40)" />
          <input id="technique" placeholder="Техника (MILD / WBTB / RC)" />
          <input id="level" type="number" min="0" max="5" placeholder="Осознанность 0–5" />
          <textarea id="note" placeholder="Сон / ощущения / выводы" />

          <button onClick={saveJournalEntry}>Save</button>

          <ul>
            {entries.map((e, i) => (
              <li key={i}>
                {e.date} · L{e.level} · {e.technique} — {e.note}
              </li>
            ))}
          </ul>

          <small style={{opacity:0.4}}>v{APP_VERSION}</small>
        </div>
      )}

      {/* ===== BLOCK: TRACKER UI ===== */}
      {page === "tracker" && (
        <div>
          <h2>Tracker</h2>
          <p>Всего записей: {entries.length}</p>
        </div>
      )}
    </div>
  );
}

// ===================================================
// =============== BLOCK: RENDER =====================
// ===================================================
ReactDOM
  .createRoot(document.getElementById("root"))
  .render(<App />);

</script>
</body>
</html>
