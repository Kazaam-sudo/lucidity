<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Lucidity</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />


  <!-- React 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
    }
    h1 { margin-top: 0; }
    button {
      margin: 4px;
      padding: 8px 12px;
      background: #1f1f1f;
      color: #fff;
      border: 1px solid #333;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      height: 80px;
      margin-top: 8px;
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
      padding: 8px;
    }
    ul { padding-left: 16px; }
    li { margin: 4px 0; }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">

function App() {
  const [page, setPage] = React.useState("journal");
  const [entries, setEntries] = React.useState(
    JSON.parse(localStorage.getItem("journal") || "[]")
  );

  function addEntry() {
    const textarea = document.getElementById("note");
    const text = textarea.value.trim();
    if (!text) return;

    const updated = [
      ...entries,
      { text, time: new Date().toLocaleString() }
    ];

    setEntries(updated);
    localStorage.setItem("journal", JSON.stringify(updated));
    textarea.value = "";
  }

  return (
    <div>
      <h1>Lucidity</h1>

      <nav>
        <button onClick={() => setPage("journal")}>Journal</button>
        <button onClick={() => setPage("tracker")}>Tracker</button>
        <button onClick={() => setPage("help")}>Help</button>
      </nav>

      {page === "journal" && (
        <div>
          <h2>Journal</h2>
          <textarea id="note" placeholder="Что снилось / техника / мысли" />
          <button onClick={addEntry}>Save</button>

          <ul>
            {entries.map((e, i) => (
              <li key={i}>{e.time} — {e.text}</li>
            ))}
          </ul>
        </div>
      )}

      {page === "tracker" && (
        <div>
          <h2>Tracker</h2>
          <p>Всего записей: {entries.length}</p>
        </div>
      )}

      {page === "help" && (
        <div>
          <h2>Help</h2>
          <p>
            Осознанность начинается с вопроса:<br/>
            <strong>«Я сейчас сплю или нет?»</strong>
          </p>
        </div>
      )}
    </div>
  );
}

ReactDOM
  .createRoot(document.getElementById("root"))
  .render(<App />);

</script>
</body>
</html>
